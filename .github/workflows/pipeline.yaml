# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Esteira CI/CD

on:
  push:
    branches:
      - devops

jobs:
  deploys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        # -------------------------
        # TESTES
        # -------------------------
      - name: Run unit tests
        run: |
          pip install -r src/requirements.txt
          pytest || true

      # - name: SonarQube Scan
      #   uses: sonarsource/sonarqube-scan-action@v2
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #     SONAR_SCANNER_OPTS: 
      #       -Dsonar.ws.timeout=60 
      #       -Dsonar.web.http.header.ngrok-skip-browser-warning=true

      # - name: SonarQube Quality Gate
      #   uses: sonarsource/sonarqube-quality-gate-action@v1
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # - name: Build image
      #   run: |
      #     docker build -t amatildes/fakeshop:${{ github.run_number }} -f src/Dockerfile src

      # - name: Trivy image scan
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: amatildes/fakeshop:${{ github.run_number }}
      #     severity: CRITICAL,HIGH
      #     exit-code: 1

      - name: Login to DockerHub
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Push image
        run: |
          docker push amatildes/fakeshop:${{ github.run_number }}

      - name: Clone GitOps repo
        run: |
          git clone https://${{ secrets.AZURE_DEVOPS_PAT }}@dev.azure.com/adrianomatildes/devops-config/_git/devops-config
      
      - name: Update image tag in GitOps repo
        run: |
          cd devops-config
          sed -i "s|image:.*|image: amatildes/fakeshop:${{ github.run_number }}|" apps/fake-shop/overlays/dev/image-patch.yaml
      
      - name: Commit and push change
        run: |
          cd devops-config
          git config user.email "ci@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "fake-shop: update image to ${{ github.run_number }}"
          git push
